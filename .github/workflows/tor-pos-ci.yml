name: TOR-POS Windows kontrol

# R127: the repository now holds the whole project folder. The Desktop job
# runs inside Desktop/, the Cloud job inside Cloud/ - the steps themselves are
# unchanged from when each lived in its own place.

on:
  push:
    # Keep the DEV4 branch independently testable when unrelated main changes
    # temporarily prevent GitHub from producing a pull-request merge ref.
    branches: [main, feature/restaurant-third-exe]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tor-pos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TEST_PROJECT: tests/TorPos.SafetyTests/TorPos.SafetyTests.csproj

jobs:
  windows-checks:
    name: Windows derleme ve mevcut testler
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: Desktop
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Repository hijyenini doğrula
        run: |
          pwsh -NoProfile -File tools/Verify-Repository-Hygiene.ps1 -RequireGit

      - name: Fiskal production kilidini doğrula
        run: |
          pwsh -NoProfile -File tools/Verify-Fiscal-Release-Gates.ps1

      - name: Sürüm tutarlılığını doğrula
        run: |
          pwsh -NoProfile -File tools/Verify-Version.ps1

      - name: Simulator sözleşmesini doğrula
        run: |
          pwsh -NoProfile -File tools/Verify-Simulator-Contract.ps1

      - name: .NET 10 SDK kur
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Ortami hazirla
        env:
          CI_DOTNET_SDK: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          New-Item -ItemType Directory -Force ci-results | Out-Null
          if (-not (Test-Path global.json)) {
            @{ sdk = @{ version = $env:CI_DOTNET_SDK; rollForward = 'latestPatch'; allowPrerelease = $false } } |
              ConvertTo-Json -Depth 3 | Set-Content global.json -Encoding utf8
          }
          dotnet --info | Tee-Object -FilePath ci-results/environment.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: NuGet paketlerini yukle
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet restore "$env:TEST_PROJECT" --verbosity minimal 2>&1 | Tee-Object -FilePath ci-results/restore.log
          $restoreExit = $LASTEXITCODE
          if ($restoreExit -ne 0) { exit $restoreExit }

      # The test project references App, Application, Infrastructure and Core.
      # Building it also builds these application projects from source.
      - name: Uygulamayi ve testleri Release olarak derle
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet build "$env:TEST_PROJECT" -c Release --no-restore -m:1 --verbosity minimal 2>&1 | Tee-Object -FilePath ci-results/build.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) { exit $buildExit }

      - name: Demo varyantini Release olarak derle
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet build src/TorPos.App/TorPos.App.csproj -c Release --no-restore -m:1 -p:TorDemoBuild=true --verbosity minimal 2>&1 | Tee-Object -FilePath ci-results/demo-build.log
          $demoExit = $LASTEXITCODE
          if ($demoExit -ne 0) { exit $demoExit }

      - name: Ayrik TOR Einzelhandel, TOR Gastro ve TOR Restaurant buildlerini derle
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet build src/TorPos.App/TorPos.App.csproj -c Release --no-restore -m:1 -p:TorProductEdition=KIOSK --verbosity minimal 2>&1 | Tee-Object -FilePath ci-results/einzelhandel-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/TorPos.App/TorPos.App.csproj -c Release --no-restore -m:1 -p:TorProductEdition=IMBISS --verbosity minimal 2>&1 | Tee-Object -FilePath ci-results/gastro-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/TorPos.App/TorPos.App.csproj -c Release --no-restore -m:1 -p:TorProductEdition=RESTAURANT --verbosity minimal 2>&1 | Tee-Object -FilePath ci-results/restaurant-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ayrik TOR Einzelhandel, TOR Gastro ve TOR Restaurant publish paketlerini olustur
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Remove-Item -Recurse -Force publish\split -ErrorAction SilentlyContinue
          pwsh -NoProfile -File BUILD-SPLIT-EDITIONS.ps1 -Configuration Release -Runtime win-x64 -OutputRoot publish\split 2>&1 |
            Tee-Object -FilePath ci-results/split-publish.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path publish\split\TOR-Einzelhandel\TOR-Einzelhandel.exe)) { throw 'TOR Einzelhandel executable missing.' }
          if (-not (Test-Path publish\split\TOR-Gastro\TOR-Gastro.exe)) { throw 'TOR Gastro executable missing.' }
          if (-not (Test-Path publish\split\TOR-Restaurant\TOR-Restaurant.exe)) { throw 'TOR Restaurant executable missing.' }

      # R182: building and packaging a dedicated product never proved it can
      # start. A hardcoded avares://TorPos.App/... asset URI shipped a product
      # that threw FileNotFoundException while loading its login window, and
      # every source-level check passed. This renders the real windows of each
      # dedicated build - including the startup splash and the login screen -
      # so a product that cannot come up fails here instead of at the till.
      - name: Ayrik urunlerin gercek pencerelerini ciz ve kontrol et
        timeout-minutes: 12
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet run --project tools/TorPos.UiSnapshot -c Release -p:TorProductEdition=KIOSK -- ci-results/ui-einzelhandel 1366x768 --check 2>&1 |
            Tee-Object -FilePath ci-results/ui-einzelhandel.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tools/TorPos.UiSnapshot -c Release -p:TorProductEdition=IMBISS -- ci-results/ui-gastro 1366x768 --check 2>&1 |
            Tee-Object -FilePath ci-results/ui-gastro.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tools/TorPos.UiSnapshot -c Release -p:TorProductEdition=RESTAURANT -- ci-results/ui-restaurant 1366x768 --check 2>&1 |
            Tee-Object -FilePath ci-results/ui-restaurant.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # SafetyTests is an executable, not an xUnit/MSTest test project.
      # Do not substitute dotnet test: use the same entry point as the BAT file.
      - name: Mevcut guvenlik ve regresyon testlerini calistir
        timeout-minutes: 10
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet run --project "$env:TEST_PROJECT" -c Release --no-build --no-restore 2>&1 | Tee-Object -FilePath ci-results/safety-tests.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
          $passed = Select-String -Path ci-results/safety-tests.log -Pattern '^ALL [1-9][0-9]* CHECKS PASSED$'
          if (-not $passed) { throw 'Test process ended without its final success marker.' }
          "## TOR-POS test sonucu" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $passed.Line | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          'Bu sonuc mevcut otomatik kontrolleri kapsar; donanim veya uretim onayi degildir.' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # R126: renders the till screen off-screen at five screen sizes and fails
      # when a control the cashier needs (ABMELDEN, GEMISCHT, AUSSER HAUS, the
      # TSE-AUSFALL badge) is off-screen or the numpad keys get too short - the
      # defects the small HP till showed. The screenshots are uploaded below.
      - name: Ekran yerlesimini kontrol et (5 ekran boyutu)
        timeout-minutes: 10
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet run --project tools/TorPos.UiSnapshot -c Release -- ci-results/ui --check 2>&1 | Tee-Object -FilePath ci-results/ui-layout.log
          $uiExit = $LASTEXITCODE
          if ($uiExit -ne 0) { exit $uiExit }

      # Turkish and English words are not German words: a button that fits
      # KASSIEREN can be cut in half by its translation. The layout gate is
      # therefore run once per interface language, on the till size.
      - name: Ekran yerlesimini Turkce ve Ingilizce kontrol et
        timeout-minutes: 12
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet run --project tools/TorPos.UiSnapshot -c Release -- ci-results/ui 1366x768 --check --language TR 2>&1 |
            Tee-Object -FilePath ci-results/ui-layout-tr.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tools/TorPos.UiSnapshot -c Release -- ci-results/ui 1366x768 --check --language EN 2>&1 |
            Tee-Object -FilePath ci-results/ui-layout-en.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # R159: publish as a self-contained single-file app. The package root
      # contains one obvious TOR-POS.exe; documentation stays in its own folder.
      - name: Windows x64 tek EXE test paketini olustur
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Remove-Item -Recurse -Force ci-results/publish,ci-results/package -ErrorAction SilentlyContinue
          dotnet publish src/TorPos.App/TorPos.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o ci-results/publish --verbosity minimal 2>&1 | Tee-Object -FilePath ci-results/publish.log
          $publishExit = $LASTEXITCODE
          if ($publishExit -ne 0) { exit $publishExit }

          $sourceExe = 'ci-results/publish/TorPos.App.exe'
          if (-not (Test-Path $sourceExe)) { throw 'TOR POS single-file executable was not produced.' }

          New-Item -ItemType Directory -Force -Path ci-results/package | Out-Null
          Copy-Item $sourceExe ci-results/package/TOR-POS.exe

          if (Test-Path ci-results/publish/Dokumentation) {
            Copy-Item -Recurse ci-results/publish/Dokumentation ci-results/package/Dokumentation
          }

          $rootFiles = Get-ChildItem ci-results/package -File
          if ($rootFiles.Count -ne 1 -or $rootFiles[0].Name -ne 'TOR-POS.exe') {
            throw 'Package root must contain only TOR-POS.exe.'
          }

      - name: Windows x64 tek EXE test paketini sakla
        uses: actions/upload-artifact@v7
        with:
          name: TOR-POS-Windows-x64-${{ github.sha }}
          path: Desktop/ci-results/package/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      # R162: the ZIP is a portable test artifact. Customers need the real
      # installer because it owns Program Files, uninstall registration and the
      # TOR POS desktop shortcut.
      - name: Inno Setup kur
        run: |
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Signs the product executables before they are packaged. Without the
      # signing secrets this step is a no-op and the build stays unsigned.
      - name: Ayrik urun EXElerini imzala (sertifika varsa)
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          pwsh -NoProfile -File tools/Sign-WindowsFiles.ps1 -Path publish\split\TOR-Einzelhandel\TOR-Einzelhandel.exe,publish\split\TOR-Gastro\TOR-Gastro.exe,publish\split\TOR-Restaurant\TOR-Restaurant.exe

      - name: Ayrik TOR Einzelhandel, TOR Gastro ve TOR Restaurant Setup EXElerini olustur
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup ISCC.exe not found.' }

          Remove-Item -Recurse -Force installer-output -ErrorAction SilentlyContinue
          & $iscc "TOR-Einzelhandel-Setup.iss" 2>&1 | Tee-Object -FilePath ci-results/einzelhandel-installer.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc "TOR-Gastro-Setup.iss" 2>&1 | Tee-Object -FilePath ci-results/gastro-installer.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc "TOR-Restaurant-Setup.iss" 2>&1 | Tee-Object -FilePath ci-results/restaurant-installer.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path installer-output\TOR-Einzelhandel-Setup.exe)) { throw 'TOR Einzelhandel Setup missing.' }
          if (-not (Test-Path installer-output\TOR-Gastro-Setup.exe)) { throw 'TOR Gastro Setup missing.' }
          if (-not (Test-Path installer-output\TOR-Restaurant-Setup.exe)) { throw 'TOR Restaurant Setup missing.' }

      - name: Ayrik Setup EXElerini imzala (sertifika varsa)
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          pwsh -NoProfile -File tools/Sign-WindowsFiles.ps1 -Path installer-output\TOR-Einzelhandel-Setup.exe,installer-output\TOR-Gastro-Setup.exe,installer-output\TOR-Restaurant-Setup.exe

      # One artifact per product: a customer download holds exactly one
      # setup, and the Restaurant build (still in development) never travels
      # in the same archive as the released retail/gastro products.
      - name: TOR Einzelhandel Setup EXE sakla
        uses: actions/upload-artifact@v7
        with:
          name: TOR-Einzelhandel-Setup-${{ github.sha }}
          path: Desktop/installer-output/TOR-Einzelhandel-Setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: TOR Gastro Setup EXE sakla
        uses: actions/upload-artifact@v7
        with:
          name: TOR-Gastro-Setup-${{ github.sha }}
          path: Desktop/installer-output/TOR-Gastro-Setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: TOR Restaurant Setup EXE sakla (gelistirme)
        uses: actions/upload-artifact@v7
        with:
          name: TOR-Restaurant-Setup-DEV4-${{ github.sha }}
          path: Desktop/installer-output/TOR-Restaurant-Setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Kunden Setup icin standart Windows publish olustur
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Remove-Item -Recurse -Force ci-results/setup-publish -ErrorAction SilentlyContinue
          dotnet publish src/TorPos.App/TorPos.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o ci-results/setup-publish --verbosity minimal 2>&1 |
            Tee-Object -FilePath ci-results/setup-publish.log
          $publishExit = $LASTEXITCODE
          if ($publishExit -ne 0) { exit $publishExit }
          if (-not (Test-Path ci-results/setup-publish/TorPos.App.exe)) {
            throw 'TOR POS setup publish executable was not produced.'
          }

      - name: Setup EXE manifestini dogrula
        run: |
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter mt.exe -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $mt) { throw 'Windows SDK mt.exe not found.' }

          $exe = (Resolve-Path 'ci-results/setup-publish/TorPos.App.exe').Path
          $manifestOut = (Join-Path (Resolve-Path 'ci-results').Path 'setup-app.manifest.xml')
          & $mt.FullName "-inputresource:$exe;#1" "-out:$manifestOut"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $manifestText = Get-Content $manifestOut -Raw
          if ($manifestText -notmatch 'requestedExecutionLevel\s+level="asInvoker"') {
            throw 'Installed TorPos.App.exe does not contain the required asInvoker manifest.'
          }

      - name: Kunden Setup EXE olustur
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup ISCC.exe not found.' }

          Remove-Item -Recurse -Force installer-output -ErrorAction SilentlyContinue
          & $iscc "/DMyPublishDir=ci-results\setup-publish" "/DMyOutputBaseFilename=TOR-POS-Setup" "TOR-POS-Pro-Setup.iss" 2>&1 |
            Tee-Object -FilePath ci-results/installer.log
          $setupExit = $LASTEXITCODE
          if ($setupExit -ne 0) { exit $setupExit }
          if (-not (Test-Path installer-output/TOR-POS-Setup.exe)) {
            throw 'TOR POS customer setup was not produced.'
          }

      - name: Kunden Setup EXE sakla
        uses: actions/upload-artifact@v7
        with:
          name: TOR-POS-Setup-${{ github.sha }}
          path: Desktop/installer-output/TOR-POS-Setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # upload-artifact paths are relative to the repository root, not to the
      # job's working-directory.
      # R172: publish the exact committed repository tree as source code.
      # git archive includes only tracked files, so build outputs, secrets,
      # .git metadata and local developer files are never added accidentally.
      - name: Kaynak kodu ZIP paketini olustur
        run: |
          Push-Location ..
          try {
            git archive --format=zip --output="Desktop/ci-results/TOR-POS-Source-${{ github.sha }}.zip" HEAD
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Kaynak kodu ZIP paketini sakla
        uses: actions/upload-artifact@v7
        with:
          name: TOR-POS-Source-${{ github.sha }}
          path: Desktop/ci-results/TOR-POS-Source-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Hata ve test gunluklerini sakla
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: tor-pos-ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Desktop/ci-results/*.log
            Desktop/ci-results/ui/*.png
          if-no-files-found: warn
          retention-days: 7

  cloud-checks:
    name: Cloud sozdizimi ve testler
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Cloud
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # node:sqlite without an experimental flag needs Node 22.13 or newer.
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sozdizimi kontrolu
        run: npm run check

      - name: Cloud testlerini calistir
        run: npm test
